name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Before writing a new one, look through the [open requests](https://github.com/rejochandran/issue-jump/issues?q=is%3Aissue+is%3Aopen+label%3Aenhancement%2C%22tracker+request%22+sort%3Areactions-%2B1-desc). If yours is there, add a 👍 to it instead; requests are picked up roughly in order of votes.
        Asking for another tracker? Use the **Tracker request** form.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation, not just the solution. What slows you down today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Good to know
      options:
        - label: This would need a new browser permission
        - label: I'd like to work on this myself
