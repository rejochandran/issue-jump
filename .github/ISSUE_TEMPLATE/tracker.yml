name: Tracker request
description: Ask for built-in support for another issue tracker
title: "Tracker: "
labels: [tracker request]
body:
  - type: markdown
    attributes:
      value: |
        Any tracker already works as a **Custom** tracker (Settings → Add a tracker → Custom) if you only need to jump to issues.
        Use this form to ask for the full treatment: automatic setup, previews, search and "Assigned to me".

        Check the [existing requests](https://github.com/rejochandran/issue-jump/issues?q=is%3Aissue+label%3A%22tracker+request%22+sort%3Areactions-%2B1-desc) first and add a 👍 if yours is there.
  - type: input
    id: name
    attributes:
      label: Which tracker?
      placeholder: "YouTrack"
    validations:
      required: true
  - type: dropdown
    id: hosting
    attributes:
      label: How do you use it?
      options:
        - Hosted by the vendor (one address for everyone)
        - Hosted by the vendor, with our own subdomain
        - Self-hosted on our own server
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: What does an issue link look like?
      description: Replace private names with placeholders.
      placeholder: "https://example.youtrack.cloud/issue/ABC-123"
    validations:
      required: true
  - type: input
    id: keys
    attributes:
      label: How are issues written?
      placeholder: "ABC-123, or #123, or something else"
  - type: input
    id: api
    attributes:
      label: Link to its API documentation, if you know it
  - type: checkboxes
    id: help
    attributes:
      label: Can you help?
      options:
        - label: I can test a build against my account
        - label: I'd like to write the provider myself (see docs/providers.md)
