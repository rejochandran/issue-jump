version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
    # Dependabot's own description is short; the description check is satisfied by the labels below
    # being handled by a maintainer, who edits the description before merging.
    labels: [dependencies]
