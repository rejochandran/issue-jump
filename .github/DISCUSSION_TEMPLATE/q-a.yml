title: ""
body:
  - type: markdown
    attributes:
      value: |
        The [documentation](https://github.com/rejochandran/issue-jump/wiki) and its [troubleshooting page](https://github.com/rejochandran/issue-jump/wiki/Troubleshooting) may already have the answer.
        Please leave out company names, private issue titles and API keys.
  - type: textarea
    id: question
    attributes:
      label: What would you like to know?
      description: Say what you are trying to do and what you have tried.
    validations:
      required: true
  - type: dropdown
    id: tracker
    attributes:
      label: Tracker, if it matters
      options:
        - Not about one tracker
        - Jira Cloud
        - Jira Server / Data Center
        - GitHub
        - GitLab
        - Linear
        - Custom tracker
  - type: input
    id: version
    attributes:
      label: Issue Jump version
      description: Shown at the bottom of the extension's settings.
