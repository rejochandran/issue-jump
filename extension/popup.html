<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Issue Jump</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app" id="app" data-view="loading">

    <!-- Main: one input, one list -->
    <section class="view" id="viewMain">
      <form class="bar" id="form" autocomplete="off">
        <img class="mark" src="icons/icon.svg" alt="" width="20" height="20">
        <input id="input" type="text" spellcheck="false" autocapitalize="off"
               placeholder="Issue key, number, link or search" aria-label="Issue key or search"
               role="combobox" aria-expanded="true" aria-controls="results" aria-autocomplete="list">
        <button type="submit" class="enter" id="go" tabindex="-1" title="Where Enter opens the issue">
          <span id="goLabel">New tab</span><kbd>↵</kbd>
        </button>
      </form>

      <div class="notice" id="notice" hidden>
        <span id="noticeText"></span>
        <button type="button" class="link" id="noticeAction"></button>
        <button type="button" class="notice-x" id="noticeClose" aria-label="Dismiss" hidden>
          <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </div>

      <div class="results" id="results" role="listbox" aria-label="Results"></div>

      <footer class="foot">
        <span class="keys">
          <span><kbd id="modKey">⌘</kbd><kbd>↵</kbd>New tab</span>
          <span><kbd>⇧</kbd><kbd>↵</kbd>This tab</span>
        </span>
        <button type="button" class="foot-btn" id="openSettings" title="Settings">
          <span id="siteLabel"></span>
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" d="M2.5 4.5h4M10.5 4.5h3M2.5 11.5h3M9.5 11.5h4"/><circle cx="8.5" cy="4.5" r="1.8" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="7.5" cy="11.5" r="1.8" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
        </button>
      </footer>
    </section>

    <!-- Settings -->
    <section class="view" id="viewSettings">
      <header class="head">
        <button type="button" class="back" id="closeSettings" aria-label="Back">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <h1>Settings</h1>
      </header>

      <div class="rows">
        <h2>Trackers</h2>
        <div class="trackers" id="trackerList"></div>
        <button type="button" class="trow add" id="addTracker">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span>Add a tracker</span>
        </button>

        <h2>Opening</h2>
        <div class="row">
          <div>
            <span class="label" id="sModeLabel">Open issues in</span>
            <p class="sub" id="sModeHelp"></p>
          </div>
          <div class="seg" id="sMode" role="radiogroup" aria-labelledby="sModeLabel">
            <button type="button" data-mode="auto" role="radio">Smart</button>
            <button type="button" data-mode="new" role="radio">New tab</button>
            <button type="button" data-mode="current" role="radio">This tab</button>
          </div>
        </div>
        <div class="row" id="numbersRow" hidden>
          <label for="sNumbers">Bare numbers go to</label>
          <select id="sNumbers"></select>
        </div>

        <h2>Options</h2>
        <label class="row" for="sPreview">
          <div>
            <span class="label">Previews and search</span>
            <p class="sub">Look up issues in your trackers as you type.</p>
          </div>
          <input type="checkbox" class="switch" id="sPreview">
        </label>
        <label class="row" for="sClipboard">
          <div>
            <span class="label">Paste from clipboard</span>
            <p class="sub">Prefill a copied issue key when the popup opens.</p>
          </div>
          <input type="checkbox" class="switch" id="sClipboard">
        </label>
        <div class="row">
          <span class="label">Keyboard shortcut</span>
          <button type="button" class="btn" id="shortcuts">Change</button>
        </div>
        <div class="row">
          <span class="label">Recent issues</span>
          <button type="button" class="btn" id="clearHistory">Clear</button>
        </div>
      </div>

      <footer class="about">
        <span id="version"></span>
        <a href="https://github.com/rejochandran/issue-jump" target="_blank" rel="noreferrer">GitHub</a>
        <a href="https://github.com/rejochandran/issue-jump/blob/main/PRIVACY.md" target="_blank" rel="noreferrer">Privacy</a>
        <a href="https://github.com/rejochandran/issue-jump/issues/new/choose" target="_blank" rel="noreferrer">Feedback</a>
        <a href="https://github.com/sponsors/rejochandran" target="_blank" rel="noreferrer">Sponsor</a>
      </footer>
    </section>

    <!-- Choose a tracker to add. Also the first screen when none could be found. -->
    <section class="view" id="viewAdd">
      <header class="head" id="addHead">
        <button type="button" class="back" id="addBack" aria-label="Back">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <h1>Add a tracker</h1>
      </header>
      <div class="welcome" id="welcome" hidden>
        <img src="icons/icon.svg" alt="" width="36" height="36">
        <h1>Where do your issues live?</h1>
        <p>Pick one to start. You can add more later.</p>
      </div>
      <div class="rows">
        <div id="foundBlock" hidden>
          <h2>Found in your tabs</h2>
          <div class="trackers" id="foundList"></div>
          <h2>Or choose</h2>
        </div>
        <div class="trackers" id="typeList"></div>
      </div>
    </section>

    <!-- One tracker's details -->
    <section class="view" id="viewTracker">
      <header class="head">
        <button type="button" class="back" id="trackerBack" aria-label="Back">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <h1 id="trackerTitle"></h1>
        <input type="checkbox" class="switch" id="tEnabled" title="Use this tracker" aria-label="Use this tracker">
      </header>
      <form class="rows" id="trackerForm" autocomplete="off">
        <div id="trackerFields"></div>
        <p class="sub" id="trackerStatus"></p>
        <p class="sub bad" id="trackerError" hidden></p>
        <div class="formfoot">
          <button type="button" class="btn danger" id="trackerRemove">Remove</button>
          <button type="submit" class="btn primary" id="trackerSave">Save</button>
        </div>
      </form>
    </section>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
